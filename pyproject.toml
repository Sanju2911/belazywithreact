[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "belazywithreact"
version = "0.1.0"
description = "A Python CLI that scaffolds ready-to-use React projects."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["react", "vite", "typescript", "scaffold", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["typer>=0.12,<1.0", "rich>=13.7,<15.0"]

[project.urls]
Homepage = "https://github.com/Sanju2911/belazywithreact"
Repository = "https://github.com/Sanju2911/belazywithreact"
Issues = "https://github.com/Sanju2911/belazywithreact/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "build>=1.2", "twine>=6.0"]

[project.scripts]
belazywithreact = "belazywithreact.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/belazywithreact"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/pyproject.toml", "/README.md", "/LICENSE", "/CONTRIBUTING.md", "/RELEASING.md", "/SECURITY.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
